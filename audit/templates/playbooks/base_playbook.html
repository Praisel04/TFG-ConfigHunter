<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Playbook de Análisis Forense - SSH</title>

<style>
/* ===================== */
/*   ESTILOS GENERALES   */
/* ===================== */

body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background-color: #FFFFFF;
    color: #111;
    line-height: 1.5;
}

/* Títulos */
h1, h2, h3 {
    color: #D40000;
    font-weight: 700;
}

/* Separador */
.section-divider {
    border-bottom: 2px solid #D40000;
    margin: 25px 0;
}

/* Tablas */
table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}
th {
    background-color: #0B0B0B;
    color: #FFF;
    padding: 10px;
}
td {
    padding: 8px;
    border: 1px solid #CCC;
}

/* Bloques */
.block {
    background: #F7F7F7;
    padding: 12px;
    border-left: 6px solid #D40000;
    border-radius: 4px;
    margin-bottom: 20px;
}

/* Pre formateado */
pre {
    background: #d8d8d8;
    padding: 6px;
    font-size: 12px;
    border-radius: 4px;
    white-space: pre-wrap;
}

/* Portada */
.cover-page {
    text-align: center;
    margin-top: 150px;
    page-break-after: always;
}
.cover-title {
    font-size: 38px;
    font-weight: bold;
    color: #D40000;
}
.cover-subtitle {
    font-size: 20px;
    color: #111;
}
.cover-meta {
    margin-top: 40px;
    color: #444;
    font-size: 16px;
}

/* Índice */
.toc-section {
    page-break-after: always;
}
.toc-item {
    font-size: 16px;
    margin: 4px 0;
}
</style>

</head>

<body>

{% include 'playbooks/cover.html' %}

{% include 'playbooks/toc.html' %}

<h2>Playbook de Hallazgos</h2>
<div class="section-divider"></div>

{% for h in hallazgos %}
    {% include 'playbooks/hallazgo.html' %}
{% endfor %}

{% include 'playbooks/end.html' %}

</body>
</html>
